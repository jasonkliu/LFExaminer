<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LF Examiner Theater Explorer</title>
<style>
  :root { color-scheme: dark; --ink:#e9edf2; --muted:#9ca8b8; --panel:#18202b; --page:#0d121a; --accent:#4dc5c1; --line:#2b3747; }
  * { box-sizing:border-box } body { margin:0; background:var(--page); color:var(--ink); font:15px/1.45 system-ui,sans-serif; }
  main { max-width:1300px; margin:auto; padding:32px 22px 50px } h1 { margin:0 0 4px; letter-spacing:-.03em } p { color:var(--muted); margin:0 0 24px }
  .filters,.cards,.charts { display:grid; gap:14px; margin-bottom:20px } .filters { grid-template-columns:2fr repeat(3,1fr) } .cards { grid-template-columns:repeat(4,1fr) } .charts { grid-template-columns:1fr 1fr }
  .panel,.card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px } .card b { display:block; color:var(--accent); font-size:28px; letter-spacing:-.04em } .card span, label { color:var(--muted); font-size:12px; font-weight:650; text-transform:uppercase; letter-spacing:.06em }
  input,select { width:100%; margin-top:6px; color:var(--ink); background:#101722; border:1px solid var(--line); border-radius:7px; padding:9px; font:inherit } h2 { font-size:16px; margin:0 0 15px }
  .bar { display:grid; grid-template-columns:minmax(90px,1fr) 3fr auto; gap:8px; align-items:center; margin:7px 0; font-size:13px } .track { height:16px; background:#101722; border-radius:99px; overflow:hidden } .fill { height:100%; background:linear-gradient(90deg,var(--accent),#668cff); border-radius:99px }
  .table-panel { overflow:auto; padding:0 } table { border-collapse:collapse; width:100%; min-width:1000px; font-size:13px } th { color:var(--muted); background:#121923; position:sticky; top:0; text-align:left; text-transform:uppercase; letter-spacing:.05em; font-size:11px } th,td { border-bottom:1px solid var(--line); padding:10px 12px; vertical-align:top } tbody tr:hover { background:#202a37 } tbody tr.review { background:#362a1e } tbody tr.review:hover { background:#4a3725 }
  .notice { color:var(--muted); font-size:13px; margin:0 0 10px } .toggle { align-self:end; color:var(--ink); font-size:13px; text-transform:none; letter-spacing:0 } .toggle input { width:auto; margin:0 7px 0 0; vertical-align:middle } @media(max-width:760px) { .filters,.cards,.charts { grid-template-columns:1fr 1fr } .filters label:first-child { grid-column:1/-1 } }
</style>
</head>
<body><main>
  <h1>LF Examiner Theater Explorer</h1>
  <p>Explore the theater records in <code>Theaters.csv</code> by location, format, and venue type.</p>
  <section class="filters">
    <label>Search<input id="search" placeholder="City, organization, country…"></label>
    <label>Country<select id="country"><option value="">All countries</option></select></label>
    <label>Format<select id="format"><option value="">All formats</option></select></label>
    <label>Laser type<select id="laserType"><option value="">All laser types</option><option value="DL">DL / single laser</option><option value="DL2">DL2 / multiple laser (incl. DL5/DL8)</option></select></label>
    <label>Type<select id="type"><option value="__exclude_n" selected>All except N</option><option value="">All types</option></select></label>
    <label>Screen size review<select id="screenReview"><option value="">All review statuses</option></select></label>
    <label class="toggle"><input type="checkbox" id="hideLieMAX" checked>Hide LieMAX (&lt; 22.8 m wide)</label>
    <label class="toggle"><input type="checkbox" id="laserOnly" checked>Laser formats (DL*)</label>
  </section>
  <section class="cards">
    <div class="card"><span>Matching theaters</span><b id="total">—</b></div>
    <div class="card"><span>Countries</span><b id="countries">—</b></div>
    <div class="card"><span>Digital venues</span><b id="digital">—</b></div>
    <div class="card"><span>Known seats</span><b id="seats">—</b></div>
  </section>
  <section class="charts">
    <div class="panel"><h2>Top countries</h2><div id="countryChart"></div></div>
    <div class="panel"><h2>Formats</h2><div id="formatChart"></div></div>
  </section>
  <p class="notice" id="status"></p>
  <label class="notice" id="filePicker" hidden>Choose the dataset: <input type="file" id="csvFile" accept=".csv,text/csv"></label>
  <section class="panel table-panel"><table><thead><tr id="head"></tr></thead><tbody id="rows"></tbody></table></section>
</main>

<script>
const columns=['Number','Country','City','State','Organization','Proj','Fmt','2D/3D','Flat/ Dome','Seats','Screen Width (m)','Screen Height (m)','Screen Size Review','LieMAX','Opened','Type'];
let data=[];
const $=id=>document.getElementById(id), select=['country','format','laserType','type','screenReview'];
const clean=v=>v||'Unknown', distinct=(items,key)=>[...new Set(items.map(x=>clean(x[key])))].sort();
document.querySelector('#head').innerHTML=columns.map(x=>`<th>${x}</th>`).join('');
function parseCsv(text) { const rows=[], row=[]; let cell='', quoted=false; for(let i=0;i<text.length;i++) { const ch=text[i], next=text[i+1]; if(ch==='"'&&quoted&&next==='"') { cell+='"'; i++; } else if(ch==='"') quoted=!quoted; else if(ch===','&&!quoted) { row.push(cell); cell=''; } else if((ch==='\n'||ch==='\r')&&!quoted) { if(ch==='\r'&&next==='\n') i++; row.push(cell); if(row.length>1||row[0]) rows.push(row.splice(0)); cell=''; } else cell+=ch; } if(cell||row.length) { row.push(cell); rows.push(row); } return rows; }
function setRecords(records) { data=records; [['country','Country'],['format','Fmt'],['type','Type'],['screenReview','Screen Size Review']].forEach(([id,key])=>{ const values=key==='Screen Size Review'?[...new Set(data.map(row=>row[key]||''))].filter(Boolean).sort():distinct(data,key); values.filter(v=>![...$(id).options].some(option=>option.value===v)).forEach(v=>$(id).insertAdjacentHTML('beforeend',`<option>${v}</option>`)); }); render(); }
function setData(csv) { const [headers,...rows]=parseCsv(csv); setRecords(rows.map(row=>Object.fromEntries(headers.map((header,i)=>[header,row[i]||''])))); }
function counts(items,key) { return Object.entries(items.reduce((a,x)=>(a[clean(x[key])]=(a[clean(x[key])]||0)+1,a),{})).sort((a,b)=>b[1]-a[1]); }
function chart(id, items, key) { const values=counts(items,key).slice(0,12), max=values[0]?.[1]||1; $(id).innerHTML=values.map(([name,n])=>`<div class="bar"><span title="${name}">${name}</span><div class="track"><div class="fill" style="width:${100*n/max}%"></div></div><b>${n}</b></div>`).join('')||'<span class="notice">No matching records.</span>'; }
function render() { const q=$('search').value.trim().toLowerCase(), typeFilter=$('type').value, reviewFilter=$('screenReview').value, laserType=$('laserType').value, hideLieMAX=$('hideLieMAX').checked, laserOnly=$('laserOnly').checked; const filtered=data.filter(x=>{ const fmt=x.Fmt||'', isMultipleLaser=fmt.includes('DL2')||fmt.includes('DL5')||fmt.includes('DL8'), matchesLaserType=!laserType||(laserType==='DL2'?isMultipleLaser:fmt.includes('DL')&&!isMultipleLaser); return (!q||Object.values(x).join(' ').toLowerCase().includes(q))&&(!$('country').value||clean(x.Country)===$('country').value)&&(!$('format').value||clean(fmt)===$('format').value)&&matchesLaserType&&(typeFilter==='__exclude_n' ? clean(x.Type)!=='N' : !typeFilter||clean(x.Type)===typeFilter)&&(!reviewFilter||clean(x['Screen Size Review'])===reviewFilter)&&(!hideLieMAX||x.LieMAX!=='Yes')&&(!laserOnly||fmt.includes('DL')); });
  $('total').textContent=filtered.length.toLocaleString(); $('countries').textContent=distinct(filtered,'Country').length; $('digital').textContent=filtered.filter(x=>clean(x.Fmt).startsWith('D')).length.toLocaleString(); $('seats').textContent=filtered.reduce((n,x)=>n+(parseInt(String(x.Seats).replace(/[^0-9]/g,''))||0),0).toLocaleString();
  chart('countryChart',filtered,'Country'); chart('formatChart',filtered,'Fmt'); $('status').textContent=`Showing ${Math.min(filtered.length,200).toLocaleString()} of ${filtered.length.toLocaleString()} matching records.`;
  $('rows').innerHTML=filtered.slice(0,200).map(x=>columns.map(c=>`<td>${x[c]||''}</td>`).join('')).map(x=>`<tr class="${x['Screen Size Review'] !== 'OK' ? 'review' : ''}">${x}</tr>`).join(''); }
['search',...select].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render)); ['hideLieMAX','laserOnly'].forEach(id=>$(id).addEventListener('change',render)); $('csvFile').addEventListener('change',event=>{ const file=event.target.files[0]; if(file) { file.text().then(setData); $('filePicker').hidden=true; } }); $('status').textContent='Loading Theaters.csv…'; fetch('Theaters.csv').then(response=>{ if(!response.ok) throw Error(response.status); return response.text(); }).then(setData).catch(()=>{ setRecords(JSON.parse($('fallbackData').textContent)); $('status').textContent='Loaded the bundled backup. Serve this folder to load the current Theaters.csv automatically.'; });
</script></body></html>
